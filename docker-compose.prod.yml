services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: ukr-forum-backend:prod
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - ./backend/.env
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: ukr-forum-nginx:prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:18.4-trixie
    restart: unless-stopped
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql

  redis:
    image: redis:8.10.0-trixie
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --save 60 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: ukr-forum-backend:prod
    entrypoint: []
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2} --max-tasks-per-child=100 --prefetch-multiplier=1
    env_file:
      - ./backend/.env
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  loki:
    image: grafana/loki:3.7.3
    restart: unless-stopped
    expose:
      - "3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yaml

  promtail:
    image: grafana/promtail:3.6.10
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.0.3
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - GF_SERVER_ROOT_URL=http://127.0.0.1/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
    env_file:
      - ./backend/.env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki

volumes:
  static_data:
  media_data:
  db-data:
  loki_data:
  grafana_data:
  backend_media:
  redis-data: