server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: backend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_service"]
        regex: "backend"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - target_label: "job"
        replacement: "backend"
    pipeline_stages:
      - match:
          selector: '{job="backend"}'
          stages:
            - drop:
                expression: '.*"GET /api/health/?(?:\?[^\s"]*)? HTTP/[^\"]+" 200 .*'
      - json:
          expressions:
            level: level
            log_type: log_type
            module: module
      - labels:
          level:
          log_type:
          module:
