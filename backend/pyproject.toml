[project]
name = "ukr-rest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "evilsenpa1", email = "alexcorporationo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "amqp==5.3.1",
    "argon2-cffi==25.1.0",
    "argon2-cffi-bindings==26.1.0",
    "asgiref==3.11.1",
    "attrs==26.1.0",
    "billiard==4.2.4",
    "celery==5.6.3",
    "certifi==2026.4.22",
    "cffi==2.1.1",
    "charset-normalizer==3.4.7",
    "click==8.4.2",
    "click-didyoumean==0.3.1",
    "click-plugins==1.1.1.2",
    "click-repl==0.3.0",
    "colorama==0.4.6",
    "django==6.0.7",
    "django-cors-headers==4.9.0",
    "django-redis==7.0.0",
    "django-stubs-ext==6.1.0",
    "djangorestframework==3.17.1",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.29.0",
    "faker==40.37.0",
    "gunicorn==26.2.0",
    "idna==3.13",
    "inflection==0.5.1",
    "iniconfig==2.3.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "kombu==5.6.2",
    "packaging==26.1",
    "pillow==12.2.0",
    "pluggy==1.6.0",
    "prompt-toolkit==3.0.53",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "pycparser==3.0",
    "pygments==2.20.0",
    "pyjwt==2.12.1",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "python-json-logger==4.1.0",
    "pyyaml==6.0.3",
    "redis==6.4.0",
    "referencing==0.37.0",
    "requests==2.33.1",
    "rpds-py==0.30.0",
    "sentry-sdk==2.64.0",
    "six==1.17.0",
    "sqlparse==0.5.5",
    "types-pyyaml==6.0.12.20260815",
    "typing-extensions==4.16.0",
    "tzdata==2026.2",
    "tzlocal==5.4.4",
    "uritemplate==4.2.0",
    "urllib3==2.7.0",
    "vine==5.1.0",
    "wcwidth==0.8.2",
]

[project.scripts]
ukr-forum-rest = "ukr_forum_rest:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "django-debug-toolbar==6.3.0",
    "django-stubs==6.1.0",
    "djangorestframework-stubs==3.18.0",
    "factory-boy==3.3.3",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.15.13",
]


[tool.ruff]
line-length = 100
extend-exclude = ["migrations", "node_modules", "staticfiles", "media"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "C4",        # comprehensions
    "DJ",        # flake8-django
    "DTZ",       # naive datetime
    "SIM",       # simplify
    "S",         # bandit (security)
    "PT",        # pytest-style
    "T20",       # print() checker
    "RUF",       # ruff-specific
    "PL",        # pylint
]
ignore = [
    "DJ001",     # null=True на CharField (not sure)
    "RUF012",    # mutable class attrs (Meta, serializers: fields = [...])
    "PLR0913",   # много аргументов
    "PLR2004",   # magic values
    "S101",      # assert (for tests)
]

# unfixable = ["F401"]

allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PLR", "T20"]
"**/test_*.py" = ["S", "PLR", "T20"]
"**/conftest.py" = ["S"]
"**/settings/*.py" = ["F403", "F405", "E501"]
"**/settings.py" = ["E501", "S105"]
"manage.py" = ["T20", "PLC0415"]
"**/admin.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps", "core"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
combine-as-imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "rest_framework.serializers.CurrentUserDefault",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
